name: Release CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      GEMINI_API_KEY: test-gemini-key
      STRIPE_SECRET_KEY: sk_test_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit.json
          code=$?
          echo "audit_exit=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Lint
        id: lint
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee lint.log
          code=${PIPESTATUS[0]}
          echo "lint_exit=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics
          path: |
            npm-audit.json
            lint.log
          retention-days: 7

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Enforce audit and lint gates
        shell: bash
        run: |
          test "${{ steps.audit.outputs.audit_exit }}" = "0"
          test "${{ steps.lint.outputs.lint_exit }}" = "0"
